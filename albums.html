  <!-- JENDELA DETAIL ALBUM -->

      <button class="modal-tutup" id="mTutup" aria-label="Tutup">✕</button>
      <img class="modal-cover" id="mCover" src="" alt="">
      <h2 id="mJudul"></h2>
      <p class="modal-artist" id="mArtist"></p>
      <p class="modal-deskripsi" id="mDeskripsi"></p>
      <div id="mTrackWrap">
        <h3>Tracklist</h3>
        <ol class="tracklist" id="mTracks"></ol>
      </div>
      <a class="btn btn-spotify" id="mSpotify" href="#" target="_blank" rel="noopener">Dengarkan di Spotify</a>

  <script>

        tracks: [

      },
      {
        judul: "Pray for Paris",
        artist: "Westside Gunn",
        cover: "imgalbm/2a573a11a282b2e13a41dbbe8d994ad3.jpg",
        deskripsi: "Album studio Westside Gunn yang dirilis pada 17 April 2020 melalui Griselda Records. Proyek hip-hop ini membawa ciri khas Griselda: rap penuh detail, ad-lib yang ikonik, dan produksi bernuansa gelap sekaligus mewah. Estetika fashion kelas atas dan referensi gulat profesional turut membentuk identitas album ini; sampulnya dirancang oleh Virgil Abloh.",
        tracks: [
          "400 Million Plus Tax",
          "No Vacancy",
          "George Bondo",
          "327",
          "French Toast",
          "Euro Step",
          "Allah Sent Me",

      },
      {
        judul: "In the Court of the Crimson King",
        artist: "King Crimson",
        cover: "imgalbm/3174088049fd36ff393bcf5bd5c727ea.jpg",

          "21st Century Schizoid Man",

      },
      {
        judul: "good kid, m.A.A.d city",
        artist: "Kendrick Lamar",
        cover: "imgalbm/f9327a848e09ab5fb71cd2f86bce0212 (1).jpg",
        deskripsi: "Album major-label debut Kendrick Lamar yang dirilis pada 22 Oktober 2012, dengan subtitle “A Short Film by Kendrick Lamar”. Disusun seperti film naratif, album ini mengikuti pengalaman seorang remaja di Compton dan mengeksplorasi pengaruh lingkungan, tekanan pergaulan, keluarga, serta pencarian jati diri. Cerita yang saling terhubung dan produksi yang beragam menjadikannya salah satu album hip-hop paling berpengaruh pada masanya.",
        tracks: [
          "Sherane a.k.a Master Splinter's Daughter",

        ],
        spotify: "https://open.spotify.com/album/748dZDqSZy6aPXKcI9H80u?si=ceL5OeeVR_yFTtVjYweEdw&utm_source=copy-link"
      }
    ];
    // =====================================

    // ====== EDIT DATA TOP TRACKS DI SINI ======
    // cover: nama file di folder imgalbm/
    const topTracks = [
      { judul: "Judul Lagu 1", artist: "Nama Artist 1", cover: "imgalbm/track1.jpg",
        deskripsi: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore.",
        spotify: "https://open.spotify.com/" },
      { judul: "Judul Lagu 2", artist: "Nama Artist 2", cover: "imgalbm/track2.jpg",
        deskripsi: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut enim ad minim veniam, quis nostrud.",
        spotify: "https://open.spotify.com/" },
      { judul: "Judul Lagu 3", artist: "Nama Artist 3", cover: "imgalbm/track3.jpg",
        deskripsi: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Duis aute irure dolor in reprehenderit.",
        spotify: "https://open.spotify.com/" },
      { judul: "Judul Lagu 4", artist: "Nama Artist 4", cover: "imgalbm/track4.jpg",
        deskripsi: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Excepteur sint occaecat cupidatat.",
        spotify: "https://open.spotify.com/" },
      { judul: "Judul Lagu 5", artist: "Nama Artist 5", cover: "imgalbm/track5.jpg",
        deskripsi: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sunt in culpa qui officia deserunt.",
        spotify: "https://open.spotify.com/" }
    ];
    // ==========================================

    const grid = document.getElementById("albumGrid");
    const modal = document.getElementById("modal");
    let terakhirFokus = null;

    albums.forEach(a => {
      const tombol = document.createElement("button");
      tombol.className = "album-item";
      tombol.type = "button";
      tombol.innerHTML =
        '<img src="' + a.cover + '" alt="Cover ' + a.judul + '" loading="lazy">' +
        '<div class="album-info"><strong></strong><span></span></div>';
      tombol.querySelector("strong").textContent = a.judul;
      tombol.querySelector("span").textContent = a.artist;
      tombol.addEventListener("click", () => buka(a, tombol));
      grid.appendChild(tombol);
    });

    const daftarTrack = document.getElementById("trackList");
    topTracks.forEach(t => {
      const tombol = document.createElement("button");
      tombol.className = "track-item";
      tombol.type = "button";
      tombol.innerHTML =
        '<img src="' + t.cover + '" alt="Cover ' + t.judul + '" loading="lazy">' +
        '<div class="track-info"><strong></strong><span></span></div>' +
        '<span class="track-panah" aria-hidden="true">›</span>';
      tombol.querySelector("strong").textContent = t.judul;
      tombol.querySelector(".track-info span").textContent = t.artist;
      tombol.addEventListener("click", () => buka(t, tombol));
      daftarTrack.appendChild(tombol);
    });

    // a = album (punya tracks) atau single track (tanpa tracks)
    function buka(a, pemicu) {
      terakhirFokus = pemicu;
      document.getElementById("mCover").src = a.cover;
      document.getElementById("mCover").alt = "Cover " + a.judul;
      document.getElementById("mJudul").textContent = a.judul;
      document.getElementById("mArtist").textContent = a.artist;
      document.getElementById("mDeskripsi").textContent = a.deskripsi;
      document.getElementById("mSpotify").href = a.spotify;
      const ol = document.getElementById("mTracks");
      ol.innerHTML = "";
      const adaTracks = Array.isArray(a.tracks);
      document.getElementById("mTrackWrap").style.display = adaTracks ? "" : "none";
      if (adaTracks) {
        a.tracks.forEach(t => {
          const li = document.createElement("li");
          li.textContent = t;
          ol.appendChild(li);
        });
      }
      modal.classList.add("tampil");
      document.body.style.overflow = "hidden";
      document.getElementById("mTutup").focus();
    }

    function tutup() {
      modal.classList.remove("tampil");
      document.body.style.overflow = "";
      if (terakhirFokus) terakhirFokus.focus();
    }

    document.getElementById("mTutup").addEventListener("click", tutup);
    modal.addEventListener("click", e => { if (e.target === modal) tutup(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") tutup(); });
  </script>

</body>
</html>
