    // =====================================

    // ====== EDIT DATA TOP TRACKS DI SINI ======

        deskripsi: "Single dari album Let God Sort Em Out (2025), reuni Clipse (Pusha T dan Malice) setelah sekitar 16 tahun, dengan seluruh album diproduseri Pharrell. Beat-nya memadukan sampel string bernuansa Timur Tengah dengan 808 yang diputar terbalik, sementara verse penutup Pusha T ramai dibahas karena menyindir Travis Scott.",

      },
      {
        judul: "Never Let Me Down",
        artist: "Kanye West, JAY-Z & J. Ivy",
        cover: "imgalbm/SpotiMate.io - Never Let Me Down - Kanye West.jpg",
        deskripsi: "Lagu dari album debut Kanye West, The College Dropout (2004), dengan Jay-Z dan penyair J. Ivy. Kanye dan Jay-Z bertukar bait soal bertahan menghadapi rintangan, lalu J. Ivy menutupnya dengan puisi tentang iman. Sering dianggap salah satu deep cut terbaik di album itu.",
        spotify: "https://open.spotify.com/track/34j4OxJxKznBs88cjSL2j9?si=j821M-ctTI-mUAFao-9Ftg&utm_source=copy-link"
      },
      {
        judul: "Simpan Saja",
        artist: "Ecoutez",
        cover: "imgalbm/ab67616d0000b27380771106caae6467ff44b240.jpeg",
        deskripsi: "Single pertama band Ecoutez asal Jakarta dari album debut Ekute (2006), disusul Percayalah dan Tunjuk Satu Bintang. Lagu pop ini sempat jadi top request di radio-radio Indonesia dan sampai sekarang masih jadi salah satu lagu andalan mereka di konser.",
        spotify: "https://open.spotify.com/track/6nIptzv5jqfdiDw9Aen0Ad?si=czbfuZK8TXO0aVn4QR_GnQ&utm_source=copy-link"
      }
    ];
    // ==========================================

    const grid = document.getElementById("albumGrid");
    const modal = document.getElementById("modal");
    let terakhirFokus = null;

    // Bikin satu tombol kartu (album / track) lalu pasang event klik
    function buatItem(data, kelas, kelasInfo, panah) {
      const tombol = document.createElement("button");
      tombol.className = kelas;
      tombol.type = "button";
      tombol.innerHTML =
        '<img src="' + data.cover + '" alt="Cover ' + data.judul + '" loading="lazy">' +
        '<div class="' + kelasInfo + '"><strong></strong><span></span></div>' +
        (panah ? '<span class="track-panah" aria-hidden="true">›</span>' : "");
      tombol.querySelector("strong").textContent = data.judul;
      tombol.querySelector("." + kelasInfo + " span").textContent = data.artist;
      tombol.addEventListener("click", () => buka(data, tombol));
      return tombol;
    }

    const daftarTrack = document.getElementById("trackList");

    albums.forEach(a => grid.appendChild(buatItem(a, "album-item", "album-info", false)));
    topTracks.forEach(t => daftarTrack.appendChild(buatItem(t, "track-item", "track-info", true)));

    // a = album (punya tracks) atau single track (tanpa tracks)
    function buka(a, pemicu) {
      terakhirFokus = pemicu;
      document.getElementById("mCover").src = a.cover;
      document.getElementById("mCover").alt = "Cover " + a.judul;
      document.getElementById("mJudul").textContent = a.judul;
      document.getElementById("mArtist").textContent = a.artist;
      document.getElementById("mDeskripsi").textContent = a.deskripsi;
      document.getElementById("mSpotify").href = a.spotify;
      const ol = document.getElementById("mTracks");
      ol.innerHTML = "";
      const adaTracks = Array.isArray(a.tracks);
      document.getElementById("mTrackWrap").style.display = adaTracks ? "" : "none";
      if (adaTracks) {
        a.tracks.forEach(t => {
          const li = document.createElement("li");
          li.textContent = t;
          ol.appendChild(li);
        });
      }
      modal.classList.add("tampil");
      document.body.style.overflow = "hidden";
      document.getElementById("mTutup").focus();
    }

    function tutup() {
      modal.classList.remove("tampil");
      document.body.style.overflow = "";
      if (terakhirFokus) terakhirFokus.focus();
    }

    document.getElementById("mTutup").addEventListener("click", tutup);
    modal.addEventListener("click", e => { if (e.target === modal) tutup(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") tutup(); });
  </script>
