<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri | Adhi Sasongko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="brand">ADHI OKE</a>
    <div class="menu">
      <a href="index.html" class="menu-btn">Beranda</a>
      <a href="profil.html" class="menu-btn">Profil</a>
      <a href="gallery.html" class="menu-btn aktif">Galeri</a>
    </div>
  </nav>

  <main class="halaman halaman-lebar">
    <h1 class="judul-halaman">
      <span class="gradasi">Galeri</span>
    </h1>
    <p class="pengantar">Dokumentasi momen-momen kehidupan ini.</p>

    <div class="galeri">

      <!-- 1 foto = 1 blok <figure>. Copy-paste blok ini buat nambah foto. -->
      <figure class="foto-item">
        <img src="images/foto1.jpg" alt="Deskripsi foto 1" loading="lazy">
        <figcaption>Judul / tahun foto 1</figcaption>
      </figure>

      <figure class="foto-item">
        <img src="images/foto2.jpg" alt="Deskripsi foto 2" loading="lazy">
        <figcaption>Judul / tahun foto 2</figcaption>
      </figure>

      <figure class="foto-item">
        <img src="images/foto3.jpg" alt="Deskripsi foto 3" loading="lazy">
        <figcaption>Judul / tahun foto 3</figcaption>
      </figure>

    </div>
  </main>

  <footer class="footer">© Adhi Sasongko</footer>

  <div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    document.querySelectorAll('.foto-item img').forEach(function (img) {
      img.addEventListener('click', function () {
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.classList.add('tampil');
      });
    });

    lightbox.addEventListener('click', function () {
      lightbox.classList.remove('tampil');
    });
  </script>
</body>
</html>
