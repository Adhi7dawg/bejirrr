  <footer class="footer">© Adhi Sasongko</footer>

  <div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    document.querySelectorAll('.foto-item img').forEach(function (img) {
      img.addEventListener('click', function () {
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.classList.add('tampil');
      });
    });

    lightbox.addEventListener('click', function () {
      lightbox.classList.remove('tampil');
    });
  </script>
</body>
